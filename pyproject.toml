[project]
name = "opc-replay"
version = "0.3.0"
description = "OPC UA replay server for replaying historical data from CSV or Parquet files with real-time tag injection API and auto-generated NodeSets"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Phil", email = "phil@example.com"}
]
keywords = ["opcua", "opc-ua", "replay", "simulator", "industrial", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "opcua>=0.98.13",
    "pandas>=3.0.1",
    "pyarrow>=23.0.1",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
]

[project.scripts]
opc-replay = "opc_replay:main"
opc-inject = "opc_replay.inject_tags:main"
opc-client = "opc_replay.client:main"

[project.urls]
Homepage = "https://github.com/phil/opc-replay"
Repository = "https://github.com/phil/opc-replay"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
