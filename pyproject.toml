[project]
name = "opc-replay"
version = "0.3.0"
description = "OPC UA replay server for replaying historical data from CSV or Parquet files with real-time tag injection API and auto-generated NodeSets"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Phil", email = "phil@example.com"}
]
keywords = ["opcua", "opc-ua", "replay", "simulator", "industrial", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "cryptography>=46.0.5",
    "opcua>=0.98.13",
    "pandas>=3.0.1",
    "pyarrow>=23.0.1",
    "pytest>=9.0.2",
    "pytest-mock>=3.14.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
]

[project.scripts]
opc-replay = "opc_replay:main"
opc-inject = "opc_replay.inject_tags:main"
opc-client = "opc_replay.client:main"

[project.urls]
Homepage = "https://github.com/phil/opc-replay"
Repository = "https://github.com/phil/opc-replay"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests with mocked dependencies",
    "integration: Integration tests requiring external services",
    "slow: Tests that take more than 1 second",
    "threading: Tests for thread safety and concurrency",
]
filterwarnings = [
    # Ignore deprecation warnings from third-party opcua library (Python 3.13)
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning:opcua",
]
